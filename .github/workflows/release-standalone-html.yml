name: Release standalone HTML

on:
  push:
    tags:
      - 'dagboog-web-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dagboog-web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix dagboog-web

      - name: Build standalone HTML
        run: npm run build:singlefile --prefix dagboog-web

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset='dagboog-web/dist-singlefile/index.html#dagboog-web.html'
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$asset" --generate-notes
          fi